name: Build dev branch

on:
  push:
    branches: [dev]

permissions:
  contents: read
  secrets: read
  sonar: write

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  build:
    name: Build & Test
    runs-on: windows-latest
    strategy:
      matrix:
        os: [windows-latest]
    concurrency:
      group: ${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v4

      # Caché de paquetes SonarCloud (evita reinstalar en cada ejecución)
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/SonarProject.xml') }}
          restore-keys: |
            ${{ runner.os }}-sonar-*

      # Caché del scanner de SonarCloud (opcional pero recomendado para reducir tiempo en primera ejecución)
      - name: Cache SonarCloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v4
        with:
          path: .\.sonar\scanner
          key: ${{ runner.os }}-sonar-scanner-${{ hashFiles('**/SonarProject.xml') }}
          restore-keys: |
            ${{ runner.os }}-sonar-scanner-*

      - name: Install SonarCloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path .\.sonar\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path .\.sonar\scanner

      - name: Restore NuGet packages
        working-directory: ${{ env.SOLUTION_FILE_PATH }}
        run: dotnet restore ${{ env.SOLUTION_FILE_PATH }}

      - name: Build
        run: msbuild /m /p:Configuration=${{ env.BUILD_CONFIGURATION }} ${{ env.SOLUTION_FILE_PATH }}

      # 🔹 Coverage nativo de .NET 8 (VSTest Console está descontinuado)
      - name: Run Tests with Coverage
        run: dotnet test --no-build /c:Coverage /r:"xunit" /resultsDirectory:.\\TestResults .\Tests\**

      # 🔹 Acción oficial de SonarCloud (reemplaza begin/end manual)
      - name: SonarCloud Scan
        uses: sonarcloud/github-action@v3
        with:
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          project_key: Selinux24_Skirmish_dev
          # La acción lee automáticamente los archivos .xunit.xml generados por dotnet test
          # Si tienes múltiples soluciones, ajusta las rutas aquí si es necesario:
          # paths:
          #   - .\Tests
